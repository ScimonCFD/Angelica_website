<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 530">
  <defs>
    <style>text { font-family: 'Avenir Next','Segoe UI','Helvetica Neue',Arial,sans-serif; }</style>
    <marker id="ah" markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto">
      <polygon points="0 0,9 3,0 6" fill="#1d2a34"/>
    </marker>
    <marker id="ahm" markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto">
      <polygon points="0 0,9 3,0 6" fill="#5b6974"/>
    </marker>
  </defs>

  <!-- START -->
  <ellipse cx="260" cy="32" rx="100" ry="22" fill="#0c6c6b"/>
  <text x="260" y="38" text-anchor="middle" fill="white" font-size="14" font-weight="700">Start</text>
  <line x1="260" y1="54" x2="260" y2="74" stroke="#1d2a34" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- ── STEP 1 ── -->
  <text x="40" y="97" text-anchor="middle" fill="#0c6c6b" font-size="16" font-weight="800">1</text>
  <rect x="105" y="75" width="310" height="36" rx="9" fill="#edf7f7" stroke="#0c6c6b" stroke-width="1.5"/>
  <text x="260" y="98" text-anchor="middle" fill="#094a5c" font-size="13" font-weight="700">Assume T field</text>
  <line x1="260" y1="111" x2="260" y2="132" stroke="#1d2a34" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="270" y="125" fill="#0c6c6b" font-size="11.5" font-weight="700">T</text>

  <!-- ── STEP 2 ── -->
  <text x="40" y="155" text-anchor="middle" fill="#0c6c6b" font-size="16" font-weight="800">2</text>
  <rect x="105" y="133" width="310" height="36" rx="9" fill="#edf7f7" stroke="#0c6c6b" stroke-width="1.5"/>
  <text x="260" y="156" text-anchor="middle" fill="#094a5c" font-size="13" font-weight="700">Assume P field</text>
  <line x1="260" y1="169" x2="260" y2="190" stroke="#1d2a34" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="270" y="183" fill="#0c6c6b" font-size="11.5" font-weight="700">P</text>

  <!-- ── STEP 3 — outer loop re-entry ── -->
  <text x="40" y="213" text-anchor="middle" fill="#0c6c6b" font-size="16" font-weight="800">3</text>
  <rect x="105" y="191" width="310" height="36" rx="9" fill="#edf7f7" stroke="#0c6c6b" stroke-width="1.5"/>
  <text x="260" y="214" text-anchor="middle" fill="#094a5c" font-size="13" font-weight="700">Evaluate &#x3c1;, &#x3bc;, c&#x209a;, k</text>
  <line x1="260" y1="227" x2="260" y2="248" stroke="#1d2a34" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="270" y="241" fill="#0c6c6b" font-size="11.5" font-weight="700">&#x3c1;, &#x3bc;, c&#x209a;, k</text>

  <!-- ── STEP 4 — hydraulic loop ── -->
  <text x="40" y="271" text-anchor="middle" fill="#0c6c6b" font-size="16" font-weight="800">4</text>
  <rect x="105" y="249" width="310" height="36" rx="9" fill="#c8d8e8" stroke="#094a5c" stroke-width="2"/>
  <text x="260" y="272" text-anchor="middle" fill="#094a5c" font-size="13" font-weight="700">Hydraulic loop (SIMPLE)</text>
  <line x1="260" y1="285" x2="260" y2="302" stroke="#1d2a34" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- ── P / ṁ CONVERGENCE DIAMOND ── -->
  <polygon points="260,302 345,323 260,344 175,323" fill="white" stroke="#094a5c" stroke-width="1.5"/>
  <text x="260" y="327" text-anchor="middle" fill="#1d2a34" font-size="12" font-weight="700">&#x394;P, &#x394;&#7745; &lt; &#x3b5; ?</text>
  <!-- YES arrow -->
  <line x1="260" y1="344" x2="260" y2="366" stroke="#1d2a34" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="270" y="354" fill="#5b6974" font-size="11" font-weight="600">Yes</text>
  <text x="270" y="367" fill="#0c6c6b" font-size="11.5" font-weight="700">P, &#7745;</text>
  <!-- NO loop — inner — back to step 4 -->
  <path d="M 345,323 L 468,323 L 468,267 L 415,267" fill="none" stroke="#5b6974" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ahm)"/>
  <text x="348" y="319" fill="#5b6974" font-size="11" font-weight="600">No</text>

  <!-- ── STEP 5 ── -->
  <text x="40" y="391" text-anchor="middle" fill="#0c6c6b" font-size="16" font-weight="800">5</text>
  <rect x="105" y="368" width="310" height="36" rx="9" fill="#edf7f7" stroke="#0c6c6b" stroke-width="1.5"/>
  <text x="260" y="391" text-anchor="middle" fill="#094a5c" font-size="13" font-weight="700">Solve energy equation</text>
  <line x1="260" y1="404" x2="260" y2="424" stroke="#1d2a34" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="270" y="418" fill="#0c6c6b" font-size="11.5" font-weight="700">T*</text>

  <!-- ── T CONVERGENCE DIAMOND (step 6) ── -->
  <text x="40" y="449" text-anchor="middle" fill="#0c6c6b" font-size="16" font-weight="800">6</text>
  <polygon points="260,425 345,447 260,469 175,447" fill="white" stroke="#094a5c" stroke-width="1.5"/>
  <text x="260" y="451" text-anchor="middle" fill="#1d2a34" font-size="12" font-weight="700">&#x394;T_max &lt; &#x3b5;_T ?</text>
  <!-- YES arrow -->
  <line x1="260" y1="469" x2="260" y2="490" stroke="#1d2a34" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="270" y="483" fill="#5b6974" font-size="11" font-weight="600">Yes</text>
  <!-- NO loop — outer — back to step 3 -->
  <path d="M 345,447 L 492,447 L 492,209 L 415,209" fill="none" stroke="#5b6974" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ahm)"/>
  <text x="494" y="390" fill="#5b6974" font-size="11" font-weight="600">No</text>

  <!-- OUTPUT -->
  <ellipse cx="260" cy="512" rx="145" ry="21" fill="#0c6c6b"/>
  <text x="260" y="518" text-anchor="middle" fill="white" font-size="13" font-weight="700">Output &#x2014; converged P, &#7745;, T</text>
</svg>
