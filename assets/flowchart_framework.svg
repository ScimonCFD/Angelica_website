<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 505">
  <defs>
    <style>text { font-family: 'Avenir Next','Segoe UI','Helvetica Neue',Arial,sans-serif; }</style>
    <marker id="ah" markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto">
      <polygon points="0 0,9 3,0 6" fill="#1d2a34"/>
    </marker>
    <marker id="ahm" markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto">
      <polygon points="0 0,9 3,0 6" fill="#5b6974"/>
    </marker>
  </defs>

  <!-- START -->
  <ellipse cx="260" cy="32" rx="100" ry="22" fill="#0c6c6b"/>
  <text x="260" y="38" text-anchor="middle" fill="white" font-size="14" font-weight="700">Start</text>
  <line x1="260" y1="54" x2="260" y2="68" stroke="#1d2a34" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- ── STEP 1 ── -->
  <text x="40" y="90" text-anchor="middle" fill="#0c6c6b" font-size="16" font-weight="800">1</text>
  <rect x="65" y="68" width="390" height="36" rx="9" fill="#edf7f7" stroke="#0c6c6b" stroke-width="1.5"/>
  <text x="260" y="91" text-anchor="middle" fill="#094a5c" font-size="13" font-weight="700">Assume T field</text>
  <!-- arrow + output label -->
  <line x1="260" y1="104" x2="260" y2="120" stroke="#1d2a34" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="270" y="115" fill="#0c6c6b" font-size="11.5" font-weight="700">T</text>

  <!-- ── STEP 2 ── -->
  <text x="40" y="146" text-anchor="middle" fill="#0c6c6b" font-size="16" font-weight="800">2</text>
  <rect x="65" y="120" width="390" height="36" rx="9" fill="#edf7f7" stroke="#0c6c6b" stroke-width="1.5"/>
  <text x="260" y="143" text-anchor="middle" fill="#094a5c" font-size="13" font-weight="700">Assume P field</text>
  <!-- arrow + output label -->
  <line x1="260" y1="156" x2="260" y2="172" stroke="#1d2a34" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="270" y="167" fill="#0c6c6b" font-size="11.5" font-weight="700">P</text>

  <!-- ── STEP 3 — outer loop re-entry ── -->
  <text x="40" y="198" text-anchor="middle" fill="#0c6c6b" font-size="16" font-weight="800">3</text>
  <rect x="65" y="172" width="390" height="36" rx="9" fill="#edf7f7" stroke="#0c6c6b" stroke-width="1.5"/>
  <text x="260" y="195" text-anchor="middle" fill="#094a5c" font-size="13" font-weight="700">Evaluate &#x3c1;, &#x3bc;, c&#x209a;, k</text>
  <!-- arrow + output label -->
  <line x1="260" y1="208" x2="260" y2="224" stroke="#1d2a34" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="270" y="219" fill="#0c6c6b" font-size="11.5" font-weight="700">&#x3c1;, &#x3bc;, c&#x209a;, k</text>

  <!-- ── STEP 4 — hydraulic loop (blue, prominent) ── -->
  <text x="40" y="250" text-anchor="middle" fill="#0c6c6b" font-size="16" font-weight="800">4</text>
  <rect x="65" y="224" width="390" height="36" rx="9" fill="#c8d8e8" stroke="#094a5c" stroke-width="2"/>
  <text x="260" y="247" text-anchor="middle" fill="#094a5c" font-size="13" font-weight="700">Hydraulic loop (SIMPLE)</text>
  <line x1="260" y1="260" x2="260" y2="276" stroke="#1d2a34" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- ── P / ṁ CONVERGENCE DIAMOND ── -->
  <polygon points="260,276 345,298 260,320 175,298" fill="white" stroke="#094a5c" stroke-width="1.5"/>
  <text x="260" y="302" text-anchor="middle" fill="#1d2a34" font-size="12" font-weight="700">&#x394;P, &#x394;&#7745; &lt; &#x3b5; ?</text>
  <!-- YES arrow + output label -->
  <line x1="260" y1="320" x2="260" y2="350" stroke="#1d2a34" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="270" y="330" fill="#5b6974" font-size="11" font-weight="600">Yes</text>
  <text x="270" y="345" fill="#0c6c6b" font-size="11.5" font-weight="700">P, &#7745;</text>
  <!-- NO loop back to step 4 (inner loop) -->
  <path d="M 345,298 L 474,298 L 474,242 L 455,242" fill="none" stroke="#5b6974" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ahm)"/>
  <text x="476" y="272" fill="#5b6974" font-size="11" font-weight="600">No</text>

  <!-- ── STEP 5 ── -->
  <text x="40" y="376" text-anchor="middle" fill="#0c6c6b" font-size="16" font-weight="800">5</text>
  <rect x="65" y="350" width="390" height="36" rx="9" fill="#edf7f7" stroke="#0c6c6b" stroke-width="1.5"/>
  <text x="260" y="373" text-anchor="middle" fill="#094a5c" font-size="13" font-weight="700">Solve energy equation</text>
  <!-- arrow + output label -->
  <line x1="260" y1="386" x2="260" y2="402" stroke="#1d2a34" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="270" y="397" fill="#0c6c6b" font-size="11.5" font-weight="700">T*</text>

  <!-- ── T CONVERGENCE DIAMOND (step 6) ── -->
  <text x="40" y="426" text-anchor="middle" fill="#0c6c6b" font-size="16" font-weight="800">6</text>
  <polygon points="260,402 345,424 260,446 175,424" fill="white" stroke="#094a5c" stroke-width="1.5"/>
  <text x="260" y="428" text-anchor="middle" fill="#1d2a34" font-size="12" font-weight="700">&#x394;T_max &lt; &#x3b5;_T ?</text>
  <!-- YES arrow -->
  <line x1="260" y1="446" x2="260" y2="462" stroke="#1d2a34" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="270" y="457" fill="#5b6974" font-size="11" font-weight="600">Yes</text>
  <!-- NO loop back to step 3 (outer loop) -->
  <path d="M 345,424 L 492,424 L 492,190 L 455,190" fill="none" stroke="#5b6974" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ahm)"/>
  <text x="494" y="308" fill="#5b6974" font-size="11" font-weight="600">No</text>

  <!-- OUTPUT -->
  <ellipse cx="260" cy="484" rx="145" ry="21" fill="#0c6c6b"/>
  <text x="260" y="490" text-anchor="middle" fill="white" font-size="13" font-weight="700">Output &#x2014; converged P, &#7745;, T</text>
</svg>
