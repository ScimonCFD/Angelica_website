<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 185"
     font-family="'Avenir Next','Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <pattern id="cv-hatch" patternUnits="userSpaceOnUse"
             width="7" height="7" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#1d2a34" stroke-width="1" opacity="0.35"/>
    </pattern>
    <marker id="ah" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#1d2a34"/>
    </marker>
    <marker id="ah-l" markerWidth="7" markerHeight="5" refX="0" refY="2.5" orient="auto">
      <polygon points="7 0,0 2.5,7 5" fill="#1d2a34"/>
    </marker>
    <marker id="ah-red" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#b03020"/>
    </marker>
  </defs>

  <!-- ── Pipe fill (white base) ── -->
  <rect x="120" y="65" width="520" height="70" fill="white"/>

  <!-- ── Control volume hatching (w to e) ── -->
  <rect x="250" y="65" width="260" height="70" fill="url(#cv-hatch)"/>

  <!-- ── Pipe top and bottom edges ── -->
  <line x1="120" y1="65"  x2="640" y2="65"  stroke="#1d2a34" stroke-width="1.2"/>
  <line x1="120" y1="135" x2="640" y2="135" stroke="#1d2a34" stroke-width="1.2"/>

  <!-- ── Pipe cross-section ellipses (3D look) ── -->
  <ellipse cx="120" cy="100" rx="11" ry="35" fill="white" stroke="#1d2a34" stroke-width="1.2"/>
  <ellipse cx="380" cy="100" rx="11" ry="35" fill="white" stroke="#1d2a34" stroke-width="1.2"/>
  <ellipse cx="640" cy="100" rx="11" ry="35" fill="white" stroke="#1d2a34" stroke-width="1.2"/>

  <!-- ── Dashed face lines at w and e ── -->
  <line x1="250" y1="53" x2="250" y2="148" stroke="#1d2a34" stroke-width="1.2" stroke-dasharray="5 3"/>
  <line x1="510" y1="53" x2="510" y2="148" stroke="#1d2a34" stroke-width="1.2" stroke-dasharray="5 3"/>

  <!-- ── Node circles: W, C, E ── -->
  <circle cx="120" cy="100" r="10" fill="white" stroke="#1d2a34" stroke-width="1.5"/>
  <text x="120" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="#1d2a34">W</text>

  <circle cx="380" cy="100" r="10" fill="white" stroke="#1d2a34" stroke-width="1.5"/>
  <text x="380" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="#1d2a34">C</text>

  <circle cx="640" cy="100" r="10" fill="white" stroke="#1d2a34" stroke-width="1.5"/>
  <text x="640" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="#1d2a34">E</text>

  <!-- ── Face labels: w, e ── -->
  <text x="250" y="162" text-anchor="middle" font-size="12" font-style="italic" fill="#1d2a34">w</text>
  <text x="510" y="162" text-anchor="middle" font-size="12" font-style="italic" fill="#1d2a34">e</text>

  <!-- ── Dimension brackets ── -->
  <line x1="122" y1="40" x2="378" y2="40" stroke="#1d2a34" stroke-width="1"
        marker-start="url(#ah-l)" marker-end="url(#ah)"/>
  <text x="250" y="32" text-anchor="middle" font-size="12" font-weight="700" fill="#1d2a34">Pipe 1</text>

  <line x1="382" y1="40" x2="638" y2="40" stroke="#1d2a34" stroke-width="1"
        marker-start="url(#ah-l)" marker-end="url(#ah)"/>
  <text x="510" y="32" text-anchor="middle" font-size="12" font-weight="700" fill="#1d2a34">Pipe 2</text>

  <!-- ── Flow arrows (left, entering W) ── -->
  <line x1="28" y1="80"  x2="108" y2="80"  stroke="#1d2a34" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="28" y1="100" x2="108" y2="100" stroke="#1d2a34" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="28" y1="120" x2="108" y2="120" stroke="#1d2a34" stroke-width="1.2" marker-end="url(#ah)"/>

  <!-- ── "Flow in" label ── -->
  <text x="68" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#b03020">Flow in</text>
  <line x1="72" y1="66" x2="84" y2="66" stroke="#b03020" stroke-width="1.5" marker-end="url(#ah-red)"/>

  <!-- ── Flow arrows (right, leaving E) ── -->
  <line x1="652" y1="80"  x2="736" y2="80"  stroke="#1d2a34" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="652" y1="100" x2="736" y2="100" stroke="#1d2a34" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="652" y1="120" x2="736" y2="120" stroke="#1d2a34" stroke-width="1.2" marker-end="url(#ah)"/>

  <!-- ── "Flow out" label ── -->
  <text x="694" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#b03020">Flow out</text>
  <line x1="698" y1="66" x2="710" y2="66" stroke="#b03020" stroke-width="1.5" marker-end="url(#ah-red)"/>
</svg>
