<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 630">
  <defs>
    <style>text { font-family: 'Avenir Next','Segoe UI','Helvetica Neue',Arial,sans-serif; }</style>
    <marker id="ah" markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto">
      <polygon points="0 0,9 3,0 6" fill="#1d2a34"/>
    </marker>
    <marker id="ahm" markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto">
      <polygon points="0 0,9 3,0 6" fill="#5b6974"/>
    </marker>
  </defs>

  <!-- START -->
  <ellipse cx="260" cy="36" rx="110" ry="26" fill="#0c6c6b"/>
  <text x="260" y="42" text-anchor="middle" fill="white" font-size="14" font-weight="700">Start</text>
  <line x1="260" y1="62" x2="260" y2="80" stroke="#1d2a34" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- STEP 1: INITIALISE T -->
  <rect x="60" y="80" width="400" height="42" rx="10" fill="#edf7f7" stroke="#0c6c6b" stroke-width="2"/>
  <text x="260" y="97" text-anchor="middle" fill="#094a5c" font-size="12" font-weight="700">Initialise temperatures</text>
  <text x="260" y="113" text-anchor="middle" fill="#5b6974" font-size="11">from thermal boundary conditions</text>
  <line x1="260" y1="122" x2="260" y2="142" stroke="#1d2a34" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- STEP 2: EVALUATE ρ(T), μ(T) — loop re-entry point -->
  <rect x="60" y="142" width="400" height="42" rx="10" fill="#edf7f7" stroke="#0c6c6b" stroke-width="2"/>
  <text x="260" y="159" text-anchor="middle" fill="#094a5c" font-size="12" font-weight="700">Evaluate ρ(T ) and μ(T ) at each pipe</text>
  <text x="260" y="175" text-anchor="middle" fill="#5b6974" font-size="11">temperature-dependent fluid properties</text>
  <line x1="260" y1="184" x2="260" y2="204" stroke="#1d2a34" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- ══ SIMPLE HYDRAULIC SUB-SOLVER ══ -->
  <rect x="40" y="204" width="440" height="132" rx="12" fill="#c8d8e8" stroke="#094a5c" stroke-width="2"/>
  <path d="M 40,216 A 12,12 0 0 1 52,204 L 468,204 A 12,12 0 0 1 480,216 L 480,232 L 40,232 Z" fill="#094a5c"/>
  <text x="260" y="222" text-anchor="middle" fill="white" font-size="11.5" font-weight="700">SIMPLE Hydraulic Solver  (inner loop — runs to convergence)</text>

  <rect x="68" y="238" width="384" height="28" rx="7" fill="white" stroke="#8aaac8" stroke-width="1.5"/>
  <text x="260" y="256" text-anchor="middle" fill="#1d2a34" font-size="11.5" font-weight="600">Stage 1 — laminar seed  (exact solution, 1 iteration)</text>

  <text x="260" y="277" text-anchor="middle" fill="#5b6974" font-size="14" font-weight="700">↓</text>

  <rect x="68" y="284" width="384" height="28" rx="7" fill="white" stroke="#8aaac8" stroke-width="1.5"/>
  <text x="260" y="302" text-anchor="middle" fill="#1d2a34" font-size="11.5" font-weight="600">Stage 2 — nonlinear solve  →  converged ṁ, P</text>

  <line x1="260" y1="336" x2="260" y2="356" stroke="#1d2a34" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- STEP 3: SOLVE ENERGY EQUATION -->
  <rect x="60" y="356" width="400" height="50" rx="10" fill="#edf7f7" stroke="#0c6c6b" stroke-width="2"/>
  <text x="260" y="376" text-anchor="middle" fill="#094a5c" font-size="12" font-weight="700">Solve energy equation on converged flow field</text>
  <text x="260" y="395" text-anchor="middle" fill="#5b6974" font-size="11">NTU formula per segment  ·  Moukalled source terms for heaters</text>
  <line x1="260" y1="406" x2="260" y2="426" stroke="#1d2a34" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- STEP 4: UPDATE T WITH RELAXATION -->
  <rect x="60" y="426" width="400" height="42" rx="10" fill="#edf7f7" stroke="#0c6c6b" stroke-width="2"/>
  <text x="260" y="443" text-anchor="middle" fill="#094a5c" font-size="12" font-weight="700">Update temperatures with relaxation</text>
  <text x="260" y="459" text-anchor="middle" fill="#5b6974" font-size="11">T ← T + α·(T* − T)   ·   compute ΔT_max</text>
  <line x1="260" y1="468" x2="260" y2="488" stroke="#1d2a34" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- CONVERGENCE DIAMOND -->
  <polygon points="260,494 340,520 260,546 180,520" fill="white" stroke="#094a5c" stroke-width="1.5"/>
  <text x="260" y="524" text-anchor="middle" fill="#1d2a34" font-size="12" font-weight="700">ΔT_max &lt; ε_T ?</text>

  <!-- YES arrow -->
  <line x1="260" y1="546" x2="260" y2="566" stroke="#1d2a34" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="268" y="561" fill="#5b6974" font-size="11" font-weight="600">Yes</text>

  <!-- OUTPUT -->
  <ellipse cx="260" cy="592" rx="130" ry="26" fill="#0c6c6b"/>
  <text x="260" y="598" text-anchor="middle" fill="white" font-size="13" font-weight="700">Output — P, ṁ, T at all nodes</text>

  <!-- NO loop-back (dashed) — right side of diamond → far right → up → back to Evaluate ρ,μ rect -->
  <path d="M 340,520 L 490,520 L 490,163 L 460,163" fill="none" stroke="#5b6974" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ahm)"/>
  <text x="493" y="344" fill="#5b6974" font-size="11" font-weight="600">No</text>
</svg>
